version: '3.8'
services:
  app:
    build: ./app
    ports:
      - 8000:8000
    env_file:
      - ./app/.env
    depends_on:
      - db
      - redis
    volumes:
      - ./day-15/app/events:/app/events

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shortener
    ports:
      - 5432:5432
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - 6379:6379
    command: ["redis-server", "--save", "", "--appendonly", "no"]

volumes:
  pgdata:
